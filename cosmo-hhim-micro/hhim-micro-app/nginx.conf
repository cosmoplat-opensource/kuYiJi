# ============================================================
# H5 前端 nginx 配置（开源部署默认）
# 安全基线：
#  1. 合法 Host 白名单（防 Host 头攻击）：使用 IP/域名访问需匹配 server_name，
#     否则落到下方 default_server 直接 444 断开
#  2. server_tokens off 隐藏 nginx 版本号
#  3. 全局安全响应头（见 security-headers.conf，Dockerfile 会 COPY 到 /etc/nginx/）
# ============================================================

server {
    listen 80;
    # 合法 Host 白名单（防 Host 头攻击）：
    #   - 精确匹配：localhost / 127.0.0.1（本机访问）
    #   - 正则 ~^[a-zA-Z0-9._-]+$：放行任意"主机名/域名/IP"格式 —— IP、域名、主机名访问
    #     均可用，部署后无需改配置，也不会在仓库里写死任何具体地址（开源友好）
    #   仅拒绝含特殊字符的畸形 Host（防 CRLF 注入类攻击）
    # 注意：正则放行合法格式域名后，扫描器的"Host 头攻击"检查可能重新报低危
    # （本服务纯静态/反代、响应不反射 Host、无缓存投毒面，实际无利用面，可按需接受）
    server_name localhost 127.0.0.1 ~^[a-zA-Z0-9._-]+$;

    # 隐藏 nginx 版本号（防 Server 头泄露框架信息）
    server_tokens off;

    # 允许带下划线的请求头（如 application_sign），否则 nginx 默认丢弃
    underscores_in_headers on;

    # 全局安全响应头（/static/ 等定义了 add_header 的 location 需单独 include）
    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（图片已本地化到 /static/micro_app/）
    location /static/ {
        expires 7d;
        add_header Cache-Control "public";
        # 本 location 定义了 add_header，需单独 include 安全头（nginx 不继承 server 级）
        include /etc/nginx/security-headers.conf;
    }

    # API 反向代理 → 后端① hhim-micro-be（去掉 /api 前缀，后端无 context-path）
    location /api/ {
        proxy_pass http://hhim-micro-be:9010/;
        # 同源部署剥离 Origin：浏览器同源 POST 请求也会携带 Origin 头，
        # 而后端 Spring CORS 白名单仅含 localhost，非白名单来源会被直接 403 拒绝。
        # H5 页面与 API 同走本 nginx，属于同源请求，Origin 对后端无意义，故剥离。
        proxy_set_header Origin "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 前端路由兜底（兼容 history 模式，hash 模式不受影响）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 非白名单 Host 一律拒绝（防 Host 头攻击 / 缓存投毒 / DNS rebinding）
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
