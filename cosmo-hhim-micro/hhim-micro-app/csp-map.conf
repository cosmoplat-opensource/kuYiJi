# ============================================================
# CSP 动态源变量（http 上下文，被 nginx 主配置自动 include）
# 用途：CSP 需要放行"宿主机:9000"（MinIO 图片/视频），但每个部署的
#       服务器 IP 不同，不能用静态值。这里从 Host 头提取 IP 部分。
#   IP 访问（如 http://<服务器IP>:8080）→ $host_ip = <服务器IP>
#   域名访问 → $host_ip = 域名（若 MinIO 用独立域名/IP，需在
#   security-headers.conf 的 CSP 中手动调整 img-src/media-src/connect-src）
# ============================================================
map $host $host_ip {
    ~^(\d+\.\d+\.\d+\.\d+)$ $1;
    default $host;
}
