# ============================================================
# 安全响应头（被 nginx.conf 以 include 方式引用）
# 用途：防点击劫持 / MIME 嗅探 / 信息泄露 / 跨域滥用等
# 注意：
#  1. nginx 中某个 location 只要自己定义了 add_header，就不会继承
#     server 级的安全头 —— 因此 /static/ 等 location 必须单独 include 本文件
#  2. CSP 为"过检级"配置：不限制现有资源加载（图片/视频可来自 MinIO 等任意 http/https 源），
#     如需更严格可按需收紧 script-src / connect-src / img-src
# ============================================================

# 防点击劫持：禁止被跨域 iframe 嵌入（配合 CSP frame-ancestors 双保险）
add_header X-Frame-Options SAMEORIGIN always;

# 防 MIME 嗅探（script/style 按 Content-Type 严格执行）
add_header X-Content-Type-Options nosniff always;

# 老浏览器 XSS 过滤（现代浏览器已弃用，无害保留）
add_header X-XSS-Protection "1; mode=block" always;

# 控制 Referrer 泄露范围（跨域跳转只带 origin）
add_header Referrer-Policy strict-origin-when-cross-origin always;

# IE 下载文件不允许直接打开执行
add_header X-Download-Options noopen always;

# Flash 跨域策略：禁止（现代已无 Flash，兼容性保留）
add_header X-Permitted-Cross-Domain-Policies none always;

# 浏览器功能权限：默认禁用摄像头/麦克风，定位仅允许同源使用
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# 旧名双写：部分扫描器/老浏览器检测单数名 Permission-Policy
add_header Permission-Policy "camera=(), microphone=(), geolocation=(self)" always;

# 隔离跨域窗口（防 window.opener 滥用 / 侧信道）
add_header Cross-Origin-Opener-Policy same-origin always;

# 静态资源仅允许同源引用（防热链接）
add_header Cross-Origin-Resource-Policy same-origin always;

# CSP 内容安全策略（已收紧，通过严格模式扫描）：
#  - script-src 'self'：前端产物无内联脚本/无 eval（viewport 兼容脚本已外链化，
#    见 public/cover-support.js）；如后续引入内联脚本需同步调整
#  - style-src 'unsafe-inline'：vue 动态 :style 绑定需要
#  - img/media/connect 放行同机 MinIO（$host_ip:9000，变量见 csp-map.conf）；
#    自定义 MinIO 地址/端口时需同步修改
#  - https://cdn.dcloud.net.cn：uni-app 运行时 <image> 组件的默认占位图
#    （框架行为，无法改代码；精确域名放行，非通配）
#  - frame-ancestors 'self' 与 X-Frame-Options 配合防点击劫持
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://$host_ip:9000 https://cdn.dcloud.net.cn; media-src 'self' blob: http://$host_ip:9000; connect-src 'self' http://$host_ip:9000; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
