# Tomcat
server:
  port: 9010
hhim:
  envgroup: local
# Spring
spring:
  application:
    # 应用名称
    name: hhim-micro-app
  profiles:
    # 环境配置
    active: local
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      # 注册中心地址（开源部署可配置；当前服务注册/配置均未启用）
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:please_set_nacos_username}
      password: ${NACOS_PASSWORD:please_set_nacos_password}
      discovery:
        namespace: ${NACOS_NAMESPACE:NS04001}
        group: ${hhim.envgroup}
        # 本地禁用服务注册（公网 Nacos 403 unknown user）
        enabled: false
      config:
        # 禁用 Nacos config，改用本地 application-local.yml
        enabled: false

# 说明：
# - 启动时通过 spring.profiles.active=local 加载本地 application-local.yml
# - 服务注册已禁用（本地环境无 Nacos 凭证，避免 403）
# - 配置源改为本地 application-local.yml
